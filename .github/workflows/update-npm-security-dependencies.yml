name: Update npm security dependencies

on:
  push:
    branches:
      - security/update-vulnerable-dependencies

permissions:
  contents: write

jobs:
  update-npm-lock:
    if: "!contains(github.event.head_commit.message, 'chore: regenerate package-lock.json')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          ref: security/update-vulnerable-dependencies
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps
      - name: Apply compatible npm security fixes
        run: npm audit fix --package-lock-only --ignore-scripts --legacy-peer-deps || true
      - name: Report remaining npm advisories
        run: npm audit --audit-level=moderate || true
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Verify production asset build
        run: npm run prod
      - name: Commit updated lockfile
        run: |
          if ! git status --porcelain -- package-lock.json | grep -q .; then
            echo "No package-lock.json changes were generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate package-lock.json"
          git push origin security/update-vulnerable-dependencies
